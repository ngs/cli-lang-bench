[package]
name = "bench-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "MIT"
description = "Rust implementation of the shared benchmark CLI"
publish = false

[[bin]]
name = "bench-rs"
path = "src/main.rs"

[dependencies]
# Rust has no JSON or SHA-256 in its standard library, while Go and Bun do.
# These two crates are the de facto standard and are what a Rust author would
# reach for, so using them keeps the comparison about the languages rather
# than about hand-written cryptography. Argument parsing stays hand written in
# every implementation, so no clap here.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", features = ["asm"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
